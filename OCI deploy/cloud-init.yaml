#cloud-config

package_update: true
package_upgrade: false

packages:
  - python3-venv
  - python3-pip
  - nginx
  - wget

write_files:
  - path: /etc/nginx/sites-available/scmedai
    owner: root:root
    permissions: '0644'
    content: |
      server {
          listen 80 default_server;
          server_name _;

          location /_stcore/health {
              proxy_pass http://127.0.0.1:8501/_stcore/health;
              access_log off;
          }

          location / {
              proxy_pass http://127.0.0.1:8501;
              proxy_http_version 1.1;

              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection "upgrade";

              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;

              proxy_read_timeout 86400;
              proxy_send_timeout 86400;
          }
      }

  - path: /opt/scmedai/.env
    owner: root:root
    permissions: '0600'
    content: |
      GOOGLE_API_KEY=${google_api_key}
      GEMINI_CHAT_MODEL=${gemini_chat_model}
      GEMINI_EMBEDDING_MODEL=${gemini_embedding_model}
      EMBEDDING_PROVIDER=gemini

  - path: /etc/systemd/system/scmedai.service
    owner: root:root
    permissions: '0644'
    content: |
      [Unit]
      Description=SCMedAI
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=simple
      User=ubuntu
      WorkingDirectory=/opt/scmedai
      EnvironmentFile=/opt/scmedai/.env
      ExecStart=/opt/scmedai/.venv/bin/streamlit run app.py \
        --server.port=8501 \
        --server.address=127.0.0.1 \
        --server.headless=true \
        --browser.gatherUsageStats=false
      Restart=always
      RestartSec=10
      StandardOutput=journal
      StandardError=journal

      [Install]
      WantedBy=multi-user.target

runcmd:
  - fallocate -l 2G /swapfile
  - chmod 600 /swapfile
  - mkswap /swapfile
  - swapon /swapfile
  - sh -c 'echo "/swapfile none swap sw 0 0" >> /etc/fstab'
  - sysctl -w vm.swappiness=60

  - iptables -I INPUT 1 -p tcp --dport 80 -j ACCEPT
  - iptables -I INPUT 1 -p tcp --dport 443 -j ACCEPT
  - mkdir -p /etc/iptables
  - sh -c 'netfilter-persistent save 2>/dev/null || iptables-save > /etc/iptables/rules.v4'

  - mkdir -p /opt/scmedai
  - wget -O /tmp/app.tar.gz "${app_source_url}"
  - tar -xzf /tmp/app.tar.gz -C /opt/scmedai --strip-components=1
  - rm -f /tmp/app.tar.gz
  - chown -R ubuntu:ubuntu /opt/scmedai

  - su - ubuntu -c "python3 -m venv /opt/scmedai/.venv"
  - su - ubuntu -c "/opt/scmedai/.venv/bin/pip install --no-cache-dir --upgrade pip"
  - su - ubuntu -c "/opt/scmedai/.venv/bin/pip install --no-cache-dir -r /opt/scmedai/requirements.txt"

  - systemctl daemon-reload
  - systemctl enable scmedai
  - systemctl start scmedai

  - rm -f /etc/nginx/sites-enabled/default
  - ln -sf /etc/nginx/sites-available/scmedai /etc/nginx/sites-enabled/scmedai
  - nginx -t
  - systemctl enable nginx
  - systemctl restart nginx

final_message: "SCMedAI provisionado. Verifique: systemctl status scmedai"
