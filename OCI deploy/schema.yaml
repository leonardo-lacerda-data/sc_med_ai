title: "SCMedAI — Assistente de consulta a protocolos clínicos"
description: "Aplicação Streamlit com RAG sobre protocolos clínicos, em Oracle Cloud Infrastructure"
schemaVersion: 1.1.0
version: "20260811"
locale: "en"

variableGroups:
- title: Hidden
  visible: false
  variables:
  - compartment_ocid
  - tenancy_ocid
  - region
  - image_operating_system
  - image_operating_system_version
  - cert_passphrase

- title: "Aplicação SCMedAI"
  variables:
  - app_bundle_url
  - google_api_key
  - gemini_chat_model
  - gemini_embedding_model

- title: "Compute"
  variables:
  - instance_shape
  - instance_count
  - AD

- title: "Load Balancer"
  variables:
  - load_balancer_min_band
  - load_balancer_max_band

- title: "Acesso SSH"
  variables:
  - ssh_public_key

- title: "Rede"
  variables:
  - vcn_dns_label
  - vcn_cidr

variables:
  app_bundle_url:
    type: string
    required: true
    title: "URL do pacote da aplicação (.zip) no Object Storage"
    description: "Pre-Authenticated Request de leitura do objeto. Deve conter app.py, src/, prompts/, .streamlit/, chroma_db/ e requirements-docker.txt na raiz do zip."

  google_api_key:
    type: password
    required: true
    title: "Chave da API do Gemini"
    description: "Gravada em /opt/scmedai/.env com permissão 0600. Não fica no repositório."

  gemini_chat_model:
    type: string
    title: "Modelo de geração"
    default: "gemini-2.5-flash"

  gemini_embedding_model:
    type: string
    title: "Modelo de embeddings"
    description: "ATENÇÃO: precisa ser o mesmo usado para construir o índice, senão a busca devolve resultado ruim sem dar erro."
    default: "gemini-embedding-001"

  instance_count:
    type: enum
    enum:
      - "1"
      - "2"
    title: "Quantidade de instâncias"
    description: "A camada Always Free permite duas VM.Standard.E2.1.Micro. Duas dão redundância; uma economiza volume de inicialização."
    default: "2"

  load_balancer_min_band:
    type: enum
    enum:
    - "10"
    - "100"
    - "400"
    - "8000"
    title: "Banda mínima do Load Balancer (Mbps)"
    description: "10 Mbps é a faixa Always Free."

  load_balancer_max_band:
    type: enum
    enum:
    - "10"
    - "100"
    - "400"
    - "8000"
    title: "Banda máxima do Load Balancer (Mbps)"
    description: "Mantenha em 10 para não sair da camada gratuita."

  vcn_dns_label:
    type: string
    title: "Rótulo DNS da VCN (minúsculas, até 15 caracteres)"

  vcn_cidr:
    type: string
    title: "Bloco CIDR da VCN (exemplo: 10.0.0.0/16)"

  instance_shape:
    type: enum
    enum:
      - "VM.Standard.E2.1.Micro"
      - "VM.Standard.E2.1"
      - "VM.Standard2.1"
      - "VM.Standard2.2"
    title: "Shape das instâncias"
    description: "E2.1.Micro (1/8 OCPU, 1 GB) é a opção Always Free e é suficiente: a instância não gera embeddings, apenas serve consultas."

  AD:
    type: enum
    enum:
      - "1"
      - "2"
      - "3"
    title: "Availability Domain"
    description: "A E2.1.Micro só pode ser criada em um único AD. Se der erro de capacidade, tente outro."

  ssh_public_key:
    type: oci:core:ssh:publickey
    title: "Chave pública SSH"
    description: "Necessária para acessar a instância e ler o log do cloud-init."
    additionalProps:
      allowMultiple: true
    pattern: "((^(ssh-rsa AAAAB3NzaC1yc2|ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNT|ecdsa-sha2-nistp384 AAAAE2VjZHNhLXNoYTItbmlzdHAzODQAAAAIbmlzdHAzOD|ecdsa-sha2-nistp521 AAAAE2VjZHNhLXNoYTItbmlzdHA1MjEAAAAIbmlzdHA1Mj|ssh-ed25519 AAAAC3NzaC1lZDI1NTE5|ssh-dss AAAAB3NzaC1kc3)[0-9A-Za-z+\/]+[=]{0,3})( [^,]*)?)(,((ssh-rsa AAAAB3NzaC1yc2|ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNT|ecdsa-sha2-nistp384 AAAAE2VjZHNhLXNoYTItbmlzdHAzODQAAAAIbmlzdHAzOD|ecdsa-sha2-nistp521 AAAAE2VjZHNhLXNoYTItbmlzdHA1MjEAAAAIbmlzdHA1Mj|ssh-ed25519 AAAAC3NzaC1lZDI1NTE5|ssh-dss AAAAB3NzaC1kc3)[0-9A-Za-z+\/]+[=]{0,3})( [^,]*)?)*$"
